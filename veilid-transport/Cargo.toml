[package]
name = "veilid-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Dario", "ErikAllanKincaid"]
license = "MPL-2.0"
description = "iroh CustomTransport carrying QUIC traffic over a companion tetron-veilid daemon (VEILID-001, 017-019)"
repository = "https://github.com/ErikAllanKincaid/tetron"

# VEILID-001, 017-019. See spec/core.py's VeilidExternalDaemonProtocol
# (VEILID-017) for the current architecture: a thin TCP/JSON client to an
# external `tetron-veilid` companion daemon, not an embedded veilid-core
# node (that was the pre-2026-09-14 design; VEILID-001's own UPDATE
# explains why it changed).

[dependencies]
anyhow = "1"
iroh = { version = "1", features = ["unstable-custom-transports"] }
iroh-base = "1"
n0-watcher = "1"
# Pinned to exactly the version `iroh` itself patches to (see the
# workspace root `Cargo.toml`'s `[patch.crates-io]`) -- `RecvMeta` must be
# the *same* type iroh's own transport internals use, not a separately
# resolved copy.
noq-udp = { version = "1.1.0", default-features = false }
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "net", "io-util"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# base64url-nopad codec for AppMessage payloads and NodeId validation
# (veilid-core's own `as_human_base64` wire convention, confirmed live
# 2026-09-14). Already resolved in the workspace lockfile at 0.22.1 via
# iroh's own dependency chain -- this adds a direct edge, not a new crate
# version.
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
